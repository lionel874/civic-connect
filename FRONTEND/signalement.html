<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signaler un problème - Civic Connect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="p-3">

    <header class="mb-4">
        <h1 class="h3">Signaler un problème</h1>
        
    </header>

    <main>

        <form id="formulaire-signalement" class="mb-4">
            <div class="mb-3">
                <label for="titre" class="form-label">Titre</label>
                <input type="text" class="form-control" id="titre" placeholder="ex: Coupure d'électricité" required>
            </div>

            <div class="mb-3">
                <label for="description" class="form-label">Description</label>
                <textarea class="form-control" id="description" rows="3" placeholder="Décrivez le problème" required></textarea>
            </div>

            <div class="mb-3">
                <label for="user_id" class="form-label">Votre identifiant utilisateur</label>
                <input type="number" class="form-control" id="user_id" required>
            </div>

            <div class="mb-3">
                <label for="location_id" class="form-label">Identifiant de la localisation</label>
                <input type="number" class="form-control" id="location_id" required>
            </div>

            <button type="submit" class="btn btn-danger w-100">Signaler</button>
        </form>

        <div id="message"></div>

    </main>
    <div class="text-center mt-4 mb-3">
    <a href="index.html" class="btn btn-primary">Retour à l'accueil</a>
</div>
    <script src="app_signalement.js"></script>
</body>
</html>
