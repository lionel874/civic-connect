<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recherche - Civic Connect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="p-3">

    <header class="mb-4 d-flex justify-content-between align-items-center">
    <h1 class="h3 mb-0">Rechercher un service</h1>
    <button id="btn-voir-tous" class="btn btn-primary btn-sm">Liste des services</button>
</header>

    <main>

        <form id="formulaire-recherche" class="mb-4">
            <div class="mb-3">
                <label for="mot_cle" class="form-label">Mot-clé</label>
                <input type="text" class="form-control" id="mot_cle" placeholder="ex: plombier">
            </div>

            <div class="mb-3">
                <label for="categorie" class="form-label">Catégorie</label>
                <input type="text" class="form-control" id="categorie" placeholder="ex: Ménage">
            </div>

            <div class="mb-3">
                <label for="zone" class="form-label">Zone</label>
                <input type="text" class="form-control" id="zone" placeholder="ex: Bafoussam">
            </div>

            <button type="submit" class="btn btn-primary w-100">Rechercher</button>
        </form>

        <div id="resultats"></div>

    </main>
    <div class="text-center mt-4 mb-3">
    <a href="index.html" class="btn btn-primary">Retour à l'accueil</a>
</div>
    <script src="app.js"></script>
</body>
</html>
