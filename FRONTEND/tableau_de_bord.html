<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tableau de bord - Civic Connect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

    <header class="bg-primary text-white p-3 mb-4 text-center">
        <h1 class="h4 mb-1">📊 Tableau de bord</h1>
        
    </header>

    <main class="container">

        <section class="mb-5">
            <h2 class="h5 border-bottom pb-2 mb-3">🛒 Mes produits</h2>
            <div id="liste-produits" class="row g-3"></div>
        </section>

        <section>
            <h2 class="h5 border-bottom pb-2 mb-3">📦 Mes commandes</h2>
            <div id="liste-commandes" class="row g-3"></div>
        </section>

    </main>
     <div class="modal fade" id="modalDetails" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalTitre"></h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="modalCorps"></div>
        </div>
    </div>
</div>
<div class="text-center mt-4 mb-3">
    <a href="index.html" class="btn btn-primary">Retour à l'accueil</a>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app_tableau_de_bord.js"></script>
</body>
</html>
